<div class="ui one column grid container">
  <div class="column">
    <h1>YouTube Search
      <img
          style="float: right;"
          *ngIf="loading"
          ngSrc='assets/images/loading.gif'
          alt="" height="26" width="26"/>
    </h1>
  </div>
  <div class="ui one column grid container">
    <div class="column">
      <app-search-box
        (loading)="loading = $event"
        (results)="updateResults($event)"
        ></app-search-box>
    </div>
    <div class="ui three column grid container">
      <app-search-result class="column"
        *ngFor="let result of results"
        [result]="result">
      </app-search-result>
    </div>
  </div>
</div>
